name: Security

on:
  workflow_call:
    inputs:
      runner_json:
        description: JSON encoded runner selection from choose-runner
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJson(inputs.runner_json) }}
    container:
      image: golang:1.25.11
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Dependency review
        continue-on-error: true
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

  govulncheck:
    name: govulncheck
    runs-on: ${{ fromJson(inputs.runner_json) }}
    container:
      image: golang:1.25.11
    env:
      HOME: /tmp/certjob-home
      XDG_CACHE_HOME: /tmp/certjob-cache
      GOCACHE: /tmp/certjob-go-build-cache
      GOMODCACHE: /tmp/certjob-go-mod-cache
      GOFLAGS: -buildvcs=false
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Prepare cache directories
        run: mkdir -p /tmp/certjob-home /tmp/certjob-cache /tmp/certjob-go-build-cache /tmp/certjob-go-mod-cache

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  gosec:
    name: gosec
    runs-on: ${{ fromJson(inputs.runner_json) }}
    container:
      image: golang:1.25.11
    env:
      HOME: /tmp/certjob-home
      XDG_CACHE_HOME: /tmp/certjob-cache
      GOCACHE: /tmp/certjob-go-build-cache
      GOMODCACHE: /tmp/certjob-go-mod-cache
      GOFLAGS: -buildvcs=false
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Prepare cache directories
        run: mkdir -p /tmp/certjob-home /tmp/certjob-cache /tmp/certjob-go-build-cache /tmp/certjob-go-mod-cache

      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude=G101 ./api/... ./cmd/... ./internal/...
