name: E2E Tests

on:
  workflow_call:
    inputs:
      runner_json:
        description: JSON encoded runner selection from choose-runner
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-e2e:
    name: test-e2e
    runs-on: ${{ fromJson(inputs.runner_json) }}
    env:
      HOME: /tmp/certjob-home
      XDG_CACHE_HOME: /tmp/certjob-cache
      GOCACHE: /tmp/certjob-go-build-cache
      GOMODCACHE: /tmp/certjob-go-mod-cache
      GOFLAGS: -buildvcs=false
    steps:
      - name: Clone the code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Prepare cache directories
        run: mkdir -p /tmp/certjob-home /tmp/certjob-cache /tmp/certjob-go-build-cache /tmp/certjob-go-mod-cache

      - name: Cache Go build and module directories
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /tmp/certjob-go-build-cache
            /tmp/certjob-go-mod-cache
          key: ${{ runner.os }}-go-e2e-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-e2e-

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install the latest version of kind
        run: |
          curl --proto '=https' --tlsv1.2 --fail --show-error --location --output ./kind https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
          chmod +x ./kind
          mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e
