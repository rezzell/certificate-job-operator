name: Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # We may have a self-hosted runner available for macOS. Use it if so.
  determine-self-hosted-runner:
    runs-on: ubuntu-latest
    concurrency:
      group: runner-determination
      cancel-in-progress: false
    outputs:
      runner: ${{ steps.determine-self-hosted-runner.outputs.use-runner }}
    steps:
      - name: Debug org runner visibility
        env:
          GH_TOKEN: ${{ secrets.REZZELL_ORG_ADMIN_KEY }}
        run: |
          set -euo pipefail

          headers_file="$(mktemp)"
          body_file="$(mktemp)"
          trap 'rm -f "${headers_file}" "${body_file}"' EXIT

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -D "${headers_file}" \
            "https://api.github.com/orgs/rezzell/actions/runners?per_page=100" \
            -o "${body_file}"

          echo "Org runner API total_count: $(jq -r '.total_count' "${body_file}")"
          echo "Runners returned on this page: $(jq -r '.runners | length' "${body_file}")"

          jq -r '
            .runners[]
            | "name=\(.name) status=\(.status) busy=\(.busy) labels=\([.labels[].name] | join(","))"
          ' "${body_file}"

          next_url="$(python3 - "${headers_file}" <<'PY'
import re
import sys

headers = open(sys.argv[1], encoding="utf-8").read()
match = re.search(r'^\s*link:\s*(.*)$', headers, re.IGNORECASE | re.MULTILINE)
if not match:
    print("")
    raise SystemExit
for part in match.group(1).split(","):
    if 'rel="next"' in part:
        url = re.search(r"<([^>]+)>", part)
        if url:
            print(url.group(1))
            raise SystemExit
print("")
PY
)"

          if [[ -n "${next_url}" ]]; then
            echo "Pagination warning: additional runner pages exist (${next_url})"
          else
            echo "Pagination: no additional runner pages"
          fi

      - name: Use self-hosted runner if online, queue if available
        id: determine-self-hosted-runner
        uses: mikehardy/runner-fallback-action@dc7732f9e532c451b2527b288ba8d58fd4b0a4ca # v1
        with:
          organization: "rezzell"
          # self-hosted runner label is configured in ARC app on runner host
          primary-runner: "galleon-runner-set"
          fallback-runner: "ubuntu-latest"
          # primaries-required: 1
          fallback-on-error: false
          # Actions secrets and Dependabot secrets are separate, and this is at org level::
          # https://github.com/organizations/ankidroid/settings/secrets/dependabot
          # https://github.com/organizations/ankidroid/settings/secrets/actions
          github-token: ${{ secrets.REZZELL_ORG_ADMIN_KEY }}
  lint:
    name: Lint (Ubuntu)
    needs: determine-self-hosted-runner
    runs-on: ${{ fromJson(needs.determine-self-hosted-runner.outputs.runner) }}
    container:
      image: golang:1.25.10@sha256:c138bff780910acf4254ab3a6f7ff0f64bbd841f27bd82bfa986fe122c109538
    env:
      GOCACHE: /tmp/certjob-go-build-cache
      GOMODCACHE: /tmp/certjob-go-mod-cache
    steps:
      - name: Clone the code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Cache Go build and module directories
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /tmp/certjob-go-build-cache
            /tmp/certjob-go-mod-cache
          key: ${{ runner.os }}-go-lint-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-lint-

      - name: Run linter
        run: make lint
