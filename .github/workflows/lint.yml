name: Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # We may have a self-hosted runner available for macOS. Use it if so.
  determine-self-hosted-runner:
    runs-on: ubuntu-latest
    concurrency:
      group: runner-determination
      cancel-in-progress: false
    outputs:
      runner: ${{ steps.determine-self-hosted-runner.outputs.use-runner }}
    steps:
      - name: Use self-hosted runner if online, queue if available
        id: determine-self-hosted-runner
        uses: mikehardy/runner-fallback-action@dc7732f9e532c451b2527b288ba8d58fd4b0a4ca # v1
        with:
          organization: "rezzell"
          # self-hosted runner label is configured in ARC app on runner host
          primary-runner: "galleon-runner-set"
          fallback-runner: "ubuntu-latest"
          # primaries-required: 1
          fallback-on-error: false
          # Actions secrets and Dependabot secrets are separate, and this is at org level::
          # https://github.com/organizations/ankidroid/settings/secrets/dependabot
          # https://github.com/organizations/ankidroid/settings/secrets/actions
          github-token: ${{ secrets.REZZELL_ORG_ADMIN_KEY }}
  lint:
    name: Lint (Ubuntu)
    needs: determine-self-hosted-runner
    runs-on: ${{ fromJson(needs.determine-self-hosted-runner.outputs.runner) }}
    container:
      image: golang:1.25.10@sha256:c138bff780910acf4254ab3a6f7ff0f64bbd841f27bd82bfa986fe122c109538
    env:
      GOCACHE: /tmp/certjob-go-build-cache
      GOMODCACHE: /tmp/certjob-go-mod-cache
    steps:
      - name: Clone the code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Cache Go build and module directories
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /tmp/certjob-go-build-cache
            /tmp/certjob-go-mod-cache
          key: ${{ runner.os }}-go-lint-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-lint-

      - name: Run linter
        run: make lint
