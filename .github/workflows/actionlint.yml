name: Workflow Lint

on:
  workflow_call:
    inputs:
      runner_json:
        description: JSON encoded runner selection from choose-runner
        required: true
        type: string

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ${{ fromJson(inputs.runner_json) }}
    container:
      image: golang:1.25.11
    env:
      HOME: /tmp/certjob-home
      XDG_CACHE_HOME: /tmp/certjob-cache
      GOFLAGS: -buildvcs=false
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Prepare cache directories
        run: mkdir -p /tmp/certjob-home /tmp/certjob-cache

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Run actionlint
        run: $(go env GOPATH)/bin/actionlint .github/workflows/*.yml
