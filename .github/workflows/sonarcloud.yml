name: SonarCloud

on:
  workflow_call:
    inputs:
      runner_json:
        description: JSON encoded runner selection from choose-runner
        required: true
        type: string

permissions:
  contents: read

jobs:
  scan:
    name: scan
    runs-on: ${{ fromJson(inputs.runner_json) }}
    container:
      image: golang:1.25.11
    env:
      HOME: /tmp/certjob-home
      XDG_CACHE_HOME: /tmp/certjob-cache
      GOCACHE: /tmp/certjob-go-build-cache
      GOMODCACHE: /tmp/certjob-go-mod-cache
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Prepare cache directories
        run: mkdir -p /tmp/certjob-home /tmp/certjob-cache /tmp/certjob-go-build-cache /tmp/certjob-go-mod-cache

      - name: Resolve SonarCloud identifiers
        id: sonar-identifiers
        env:
          SONAR_ORGANIZATION_VAR: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY_VAR: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          organization="${SONAR_ORGANIZATION_VAR:-${GITHUB_REPOSITORY_OWNER}}"
          project_key="${SONAR_PROJECT_KEY_VAR:-}"
          if [ -z "${project_key}" ]; then
            project_key="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '/' '_')"
          fi
          echo "organization=${organization}" >> "${GITHUB_OUTPUT}"
          echo "project_key=${project_key}" >> "${GITHUB_OUTPUT}"

      - name: Run unit tests with coverage
        env:
          GOCACHE: /tmp/certjob-go-build-cache
          GOMODCACHE: /tmp/certjob-go-mod-cache
        run: make test

      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@55e44800a8f495208cce6e4e82f5dedb45fcf0ef # v7.2.0
        with:
          scannerVersion: 8.1.0.6389
          args: >
            -Dsonar.organization=${{ steps.sonar-identifiers.outputs.organization }}
            -Dsonar.projectKey=${{ steps.sonar-identifiers.outputs.project_key }}
            -Dsonar.go.coverage.reportPaths=cover.out
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            -Dsonar.projectVersion=${{ github.ref_name }}

      - name: Skip scan when SONAR_TOKEN is unset
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "SONAR_TOKEN is not configured; skipping SonarCloud scan."
