name: Choose Runner

on:
  workflow_call:
    inputs:
      organization:
        description: Organization that owns the runners
        required: true
        type: string
      scale-set-name:
        description: Runner scale set name prefix to look for
        required: true
        type: string
      fallback-runner:
        description: GitHub-hosted fallback runner label
        required: false
        default: ubuntu-latest
        type: string
    secrets:
      github-token:
        required: true
    outputs:
      runner:
        description: JSON array suitable for runs-on
        value: ${{ jobs.choose-runner.outputs.runner }}

jobs:
  choose-runner:
    name: Choose runner
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.select.outputs.runner }}
    steps:
      - name: Select runner
        id: select
        env:
          GITHUB_TOKEN: ${{ secrets.github-token }}
          ORGANIZATION: ${{ inputs.organization }}
          SCALE_SET_NAME: ${{ inputs.scale-set-name }}
          FALLBACK_RUNNER: ${{ inputs.fallback-runner }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY' >"$GITHUB_OUTPUT"
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          org = os.environ["ORGANIZATION"]
          scale_set_name = os.environ["SCALE_SET_NAME"]
          fallback_runner = os.environ["FALLBACK_RUNNER"]
          token = os.environ["GITHUB_TOKEN"]

          url = f"https://api.github.com/orgs/{org}/actions/runners?per_page=100"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          runner = fallback_runner

          while url:
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request) as response:
                      payload = json.load(response)
                      for item in payload.get("runners", []):
                          if item.get("status") == "online" and item.get("name", "").startswith(scale_set_name):
                              runner = scale_set_name
                              url = None
                              break
                      else:
                          link = response.headers.get("Link", "")
                          match = re.search(r'<([^>]+)>;\s*rel="next"', link)
                          url = match.group(1) if match else None
              except urllib.error.HTTPError as exc:
                  print(f"GitHub API request failed: {exc}", file=sys.stderr)
                  raise

          print(f"runner={json.dumps([runner])}")
          PY
